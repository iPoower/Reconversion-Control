name: Reconversion Control · tests mobiles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: PR validation path
        if: github.event_name == 'pull_request'
        run: echo "Pull request validation — provenance is enforced after merge on main."
      - name: Refuse direct main pushes from production
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            matches="$(gh api               -H "Accept: application/vnd.github+json"               "/repos/$REPO/commits/$SHA/pulls"               --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"
            if [ "$matches" -ge 1 ]; then
              echo "Verified: $SHA is associated with a merged pull request targeting main."
              exit 0
            fi
            echo "PR association not visible yet (attempt $attempt/5)."
            sleep 3
          done
          echo "::error::main commit $SHA is not associated with a merged pull request. Production deployment is blocked."
          exit 1

  mobile:
    needs: provenance
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - name: Dépendances de test verrouillées
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Navigateurs préinstallés et versions verrouillées
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          node tests/browser-runtime.spec.cjs
          node tests/browser-runtime.cjs
      - name: Syntaxe
        run: |
          node --check project-plan.js
          node --check app.js
          node --check data.js
          node --check course-foundations.js
          node --check course-race.js
          node --check course-operations.js
          node --check learning.js
          node --check english.js
          node --check drive-learning.js
          node --check daily-five.js
          node --check deep-dives.js
          node --check evidence-checks.js
          node --check cloud-transport.js
          node --check cloud-ui.js
          node --check sw.js
      - name: Exercices probants et modules IT sourcés
        run: |
          node tests/deep-checks.cjs
          node tests/project-checks.cjs
          node tests/cloud-sync.spec.cjs
      - name: Dossier reconversion, écoles, budget et compatibilité
        env:
          BROWSER: ${{ matrix.browser }}
          RC_SCREENSHOT_DIR: artifacts/reconversion-${{ matrix.browser }}
        run: node tests/project.spec.cjs
      - name: Navigation, recherche et affichage iPhone
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm test
      - name: Cours, sources, corrigés et progression
        env:
          BROWSER: ${{ matrix.browser }}
          RC_SCREENSHOT_DIR: artifacts/reconversion-${{ matrix.browser }}
        run: npm run test:learning
      - name: Cache et redémarrage hors connexion
        if: matrix.browser == 'chromium'
        run: npm run test:sw
      - name: Captures mobile et PC à examiner
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reconversion-visual-${{ matrix.browser }}
          path: artifacts/reconversion-${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14
