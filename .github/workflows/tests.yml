name: Reconversion Control · tests mobiles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PR validation path
        if: github.event_name == 'pull_request'
        run: echo "Pull request validation — provenance is enforced after merge on main."
      - name: Refuse direct main pushes from production
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            matches="$(gh api               -H "Accept: application/vnd.github+json"               "/repos/$REPO/commits/$SHA/pulls"               --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"
            if [ "$matches" -ge 1 ]; then
              echo "Verified: $SHA is associated with a merged pull request targeting main."
              exit 0
            fi
            echo "PR association not visible yet (attempt $attempt/5)."
            sleep 3
          done
          echo "::error::main commit $SHA is not associated with a merged pull request. Production deployment is blocked."
          exit 1

  mobile:
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Dépendances de test verrouillées
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Navigateur
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Syntaxe
        run: |
          node --check app.js
          node --check data.js
          node --check course-foundations.js
          node --check course-race.js
          node --check course-operations.js
          node --check learning.js
          node --check english.js
          node --check drive-learning.js
          node --check daily-five.js
          node --check deep-dives.js
          node --check evidence-checks.js
          node --check sw.js
      - name: Exercices probants et modules IT sourcés
        run: node tests/deep-checks.cjs
      - name: Navigation, recherche et affichage iPhone
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm test
      - name: Cours, sources, corrigés et progression
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm run test:learning
      - name: Cache et redémarrage hors connexion
        if: matrix.browser == 'chromium'
        run: npm run test:sw
