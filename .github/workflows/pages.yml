name: Deploy Reconversion Control to GitHub Pages

on:
  workflow_run:
    workflows: ["Reconversion Control · tests mobiles"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.repository.full_name == github.repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify exact successful main validation and merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify-pages.py authorize

      - name: Stage only committed public assets and stamp the tested SHA
        run: python3 .github/scripts/verify-pages.py stage

      - name: Validate staged JavaScript
        run: |
          for file in "$RUNNER_TEMP/reconversion-site/"*.js; do
            node --check "$file"
          done

      - name: Configure existing Pages site
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload verified static site
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4; internal upload-artifact also SHA-pinned
        with:
          name: reconversion-pages-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/reconversion-site

      - name: Verify actual tar contents against committed assets
        run: python3 .github/scripts/verify-pages.py archive

      - name: Recheck validation, main HEAD and uploaded artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: python3 .github/scripts/verify-pages.py uploaded

      - name: Deploy verified artifact from this run
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: reconversion-pages-${{ github.event.workflow_run.head_sha }}
