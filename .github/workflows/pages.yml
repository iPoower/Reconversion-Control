name: Deploy Reconversion Control to GitHub Pages

on:
  workflow_run:
    workflows: ["Reconversion Control · tests mobiles"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Stamp tested build SHA
        env:
          BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          sha = os.environ["BUILD_SHA"]
          if len(sha) < 12:
              raise SystemExit("Invalid build SHA")
          for name in ("index.html", "sw.js"):
              path = Path(name)
              text = path.read_text()
              if "__BUILD_SHA__" not in text:
                  raise SystemExit("Missing build placeholder in " + name)
              path.write_text(text.replace("__BUILD_SHA__", sha))
          PY

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check course-foundations.js
          node --check course-race.js
          node --check course-operations.js
          node --check learning.js
          node --check english.js
          node --check drive-learning.js
          node --check daily-five.js
          node --check deep-dives.js
          node --check evidence-checks.js
          node --check cloud-transport.js
          node --check cloud-ui.js
          node --check sw.js
          python3 -c 'from pathlib import Path; assert "__BUILD_SHA__" not in Path("index.html").read_text(); assert "__BUILD_SHA__" not in Path("sw.js").read_text()'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
